name: deploy-pages

# site/ 가 바뀌어 push 되면 GitHub Pages로 배포 → 공개 URL에서 어디서나 열람.
# 최초 1회: 저장소 Settings → Pages → "Build and deployment" → Source 를
# "GitHub Actions" 로 설정하세요.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true          # Pages가 꺼져 있으면 자동으로 켠다(설정 수동 변경 불필요)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
